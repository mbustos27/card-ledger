[workspace]
resolver = "2"
members = ["crates/core", "crates/fetch", "crates/ui", "crates/cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
csv = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
tiny_http = "0.12.0"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[profile.release]
strip = true
