      <rect x="-54" y="36" width="70" height="7" rx="3.5" fill="#2f3846"/>
      <rect x="-54" y="52" width="92" height="7" rx="3.5" fill="#2f3846"/>
      <text x="54" y="88" text-anchor="end" font-size="18" fill="#ff7a6e">$42.00</text>
