      <rect x="-74" y="-104" width="148" height="34" rx="12" fill="#f0a73a"/>
      <rect x="-74" y="-82" width="148" height="12" fill="#f0a73a"/>
      <text x="64" y="-81" text-anchor="end" font-size="16" letter-spacing="0.5" fill="#11151c">SMALL BINDER</text>
