      <rect x="-74" y="-82" width="148" height="12" fill="#7fa8ff"/>
      <text x="64" y="-81" text-anchor="end" font-size="16" letter-spacing="0.5" fill="#11151c">BIG BINDER</text>
      <rect x="-54" y="-44" width="108" height="64" rx="6" fill="#18284a"/>
      <rect x="-54" y="36" width="70" height="7" rx="3.5" fill="#2f3846"/>
      <rect x="-54" y="52" width="92" height="7" rx="3.5" fill="#2f3846"/>
      <text x="54" y="88" text-anchor="end" font-size="18" fill="#7fa8ff">$1.25</text>
    </g>
