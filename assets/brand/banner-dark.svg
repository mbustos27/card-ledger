<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">card-ledger</title>
  <desc id="d">card-ledger: real condition, real value, the right pile. Four fanned cards labelled Toploader, Small binder, Big binder and Box.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <pattern id="rules" width="1280" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27.5" x2="1280" y2="27.5" stroke="#1f2733" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#rules)" opacity="0.9"/>
  <line x1="92" y1="0" x2="92" y2="360" stroke="#5a2b2b" stroke-width="1.5" opacity="0.7"/>

  <g font-family="'Barlow Condensed','Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif">
    <text x="124" y="150" fill="#e7eaf0" font-size="92" font-weight="700" letter-spacing="0.5">card<tspan fill="#f0c040">-</tspan>ledger</text>
  </g>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="128" y="204" fill="#e7eaf0" font-size="30" font-weight="600">Real condition. Real value. The right pile.</text>
    <text x="128" y="246" fill="#9aa3b2" font-size="21">Condition-based prices for a binder of trading cards,</text>
    <text x="128" y="276" fill="#9aa3b2" font-size="21">likely scan mistakes flagged, and a pile for every card.</text>
  </g>
  <g font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace" font-size="15" fill="#6f7888">
    <text x="128" y="322">NM · LP · MP · HP · DMG</text>
  </g>

  <!-- fanned cards -->
  <g filter="url(#shadow)" font-family="'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700">
    <g transform="translate(1162 196) rotate(11)">
      <rect x="-74" y="-104" width="148" height="208" rx="12" fill="#181e28" stroke="#a5adba" stroke-width="2"/>
      <rect x="-74" y="-104" width="148" height="34" rx="12" fill="#a5adba"/>
      <rect x="-74" y="-82" width="148" height="12" fill="#a5adba"/>
      <text x="64" y="-81" text-anchor="end" font-size="16" letter-spacing="0.5" fill="#11151c">BOX</text>
      <rect x="-54" y="-44" width="108" height="64" rx="6" fill="#232a35"/>
      <rect x="-54" y="36" width="70" height="7" rx="3.5" fill="#2f3846"/>
      <rect x="-54" y="52" width="92" height="7" rx="3.5" fill="#2f3846"/>
      <text x="54" y="88" text-anchor="end" font-size="18" fill="#a5adba">$0.40</text>
