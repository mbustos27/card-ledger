# Condition multipliers and pile thresholds for card-ledger. Embedded into the build
# (crates/core/src/pricing.rs, include_str!), so edit here and rebuild.
#
# Multipliers estimated from TCGplayer per-condition prices and sales across a sample of cards,
# November 2026. Every multiplier here is "times TCGplayer NM market"; HP and Damaged are
# extrapolated from MP. Per-condition prices and per-card research ranges, when present, take
# precedence over these.

[multipliers.lp]
value = 0.54
low = 0.45
high = 0.65

[multipliers.mp]
value = 0.36
low = 0.28
high = 0.42

# HP ~ 0.67 x MP and Damaged ~ 0.42 x MP (an estimate, not a sourced ratio). Bands are the MP
# band times the same factor:
# HP 0.67 x (0.28 .. 0.42) = 0.19 .. 0.28; DMG 0.42 x (0.28 .. 0.42) = 0.12 .. 0.18.
[multipliers.hp]
value = 0.24
low = 0.19
high = 0.28

[multipliers.dmg]
value = 0.15
low = 0.12
high = 0.18

# For researched cards: HP and Damaged are derived from the card's own MP research range.
[research_derived]
hp_from_mp = 0.67
dmg_from_mp = 0.42

# Pile thresholds in USD (README.md, "Piles").
# Toploader: value >= toploader. Small binder: small_binder <= value < toploader.
[piles]
toploader = 20.0
small_binder = 2.0
