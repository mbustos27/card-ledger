# Collectr set name -> TCGdex set. Read by `identity::SetMap` (embedded at build time).
#
# Fields of each [[set]]:
#   name         Collectr's "Set" column, exactly as the export writes it.
#   id           TCGdex set id (https://api.tcgdex.net/v2/<lang>/sets/<id>).
#   alt          Other TCGdex sets to try in order when Collectr folds several into one name
#                (the two halves of a trainer kit). A card is taken from the set whose name matches.
#   lang         "en" (default) or "ja".
#   pad          How many digits TCGdex writes in localId: 0 = as printed without zeros ("15"),
#                2 = promos ("XY01", "BW09", but "XY150"), 3 = SWSH/SV/ME and all ja sets ("025").
#   radiant      true for Collectr's Radiant Collection names: the number must start with RC.
#   rc_max       Highest RC number in the TCGdex set (only for sets that have a Radiant Collection).
#   none         TCGdex has no usable data for this set; the text is the reason (card is Unresolved).
#   not_pokemon  Not a Pokémon card at all (kept, left out of the piles).
#
# Verification (2026-11-24): the set list came from /v2/en/sets and /v2/ja/sets. For every
# mapped set, /v2/<lang>/sets/<id> was fetched and each export line's number was looked up in
# the listing (with the pad below) and its TCGdex name compared to Collectr's. "listing ok" in a
# comment means every export line of that set was found by number with a matching name.

