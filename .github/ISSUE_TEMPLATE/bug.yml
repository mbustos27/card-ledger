name: Bug
description: Something in card-ledger doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't attach your collection export or ledger database**. A few lines with the cards changed is enough, and the sample file (`data/sample-export.csv`) is best.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran (e.g. `card-ledger import sample-export.csv`, `card-ledger prices`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the release name or `git describe`.
  - type: input
    id: os
    attributes:
      label: Operating system
